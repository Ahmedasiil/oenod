<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><title>OENOD</title>
<style>body{margin:0;height:100vh;display:grid;place-items:center;background:#000F55;color:#fff;font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;text-align:center}main{max-width:420px;padding:24px}h1{font-size:26px;margin:0 0 8px}p{color:#C9D4FF;margin:0 0 22px}button{background:#fff;color:#000F55;border:0;border-radius:14px;height:46px;padding:0 26px;font-weight:700;font-size:15px;cursor:pointer}</style></head>
<body><main><h1>You're offline</h1><p>OENOD can't reach the server right now. Check your internet connection and try again.</p><button id="retry">Try again</button></main>
<script>const u=new URLSearchParams(location.search).get('url');document.getElementById('retry').onclick=()=>{location.href=u+'/app'};window.addEventListener('online',()=>{location.href=u+'/app'});</script></body></html>
