<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><title>OENOD</title>
<style>body{margin:0;height:100vh;display:grid;place-items:center;background:#000F55;color:#fff;font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;text-align:center}main{max-width:420px;padding:24px}h1{font-size:26px;margin:0 0 8px}p{color:#C9D4FF;margin:0 0 22px}a{display:inline-block;background:#fff;color:#000F55;border-radius:14px;padding:13px 26px;font-weight:700;text-decoration:none}</style></head>
<body><main><h1>Update required</h1><p id="msg">A new version of OENOD is ready. Please update to keep going.</p><a id="go" href="#" target="_blank" hidden>Download the update</a></main>
<script>const q=new URLSearchParams(location.search);const l=q.get('latest');if(l)document.getElementById('msg').textContent+=' (version '+l+')';const u=q.get('url');if(/^https:\/\//.test(u||'')){const a=document.getElementById('go');a.href=u;a.hidden=false;}</script></body></html>
