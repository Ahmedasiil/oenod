name: Build OENOD apps
on:
  push:
    branches: [apps-build]
    paths-ignore: ['native/**', '.github/workflows/build-native.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install and sync
        working-directory: mobile
        run: |
          npm ci || npm install
          node configure.js
          npx cap sync android
          node patch-native.js
      - name: Build unsigned release AAB and APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease
      - name: Collect
        run: |
          mkdir -p out
          cp mobile/android/app/build/outputs/bundle/release/*.aab out/OENOD-unsigned.aab
          cp mobile/android/app/build/outputs/apk/release/*.apk out/OENOD-unsigned.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          cp $BT/lib/apksigner.jar out/apksigner.jar
          cp $BT/zipalign out/zipalign-linux
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/ }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Windows signing (Azure Artifact Signing). Unsigned build when the AZURE_* secrets are not set yet.
      - working-directory: desktop
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZ_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZ_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZ_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          npm install
          npm run prebuild
          if [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$AZ_PROFILE" ]; then
            echo "Signing with Azure Artifact Signing"
            npx electron-builder --win nsis -c.win.azureSignOptions.publisherName="OENOD Inc." -c.win.azureSignOptions.endpoint="$AZ_ENDPOINT" -c.win.azureSignOptions.codeSigningAccountName="$AZ_ACCOUNT" -c.win.azureSignOptions.certificateProfileName="$AZ_PROFILE"
          else
            echo "::warning::Windows installer is UNSIGNED (AZURE_* secrets missing)"
            npx electron-builder --win nsis
          fi
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: desktop/dist/*.exe }

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Mac signing: Developer ID certificate (MAC_CERT_P12 base64 + MAC_CERT_PASSWORD) and notarization with the
      # App Store Connect API key already used for iOS (APPLE_KEY_ID / APPLE_ISSUER_ID / APPLE_KEY_P8).
      # Ad-hoc (unsigned) build when MAC_CERT_P12 is not set yet.
      - working-directory: desktop
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_KEY_P8: ${{ secrets.APPLE_KEY_P8 }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: |
          npm install
          npm run prebuild
          if [ -n "$MAC_CERT_P12" ]; then
            echo "Signing + notarizing with Developer ID"
            mkdir -p ~/private_keys && printf '%s' "$APPLE_KEY_P8" > ~/private_keys/AuthKey_$APPLE_KEY_ID.p8
            C=$(printf '%s' "$MAC_CERT_P12" | tr -d ' \r\n')
            echo "key check: length ${#C}, sha $(printf '%s' "$C" | shasum -a 256 | cut -c1-12), starts $(printf '%s' "$C" | cut -c1-4)"
            printf '%s' "$C" | base64 -D > "$RUNNER_TEMP/devid.p12"
            export CSC_LINK="$RUNNER_TEMP/devid.p12" CSC_KEY_PASSWORD="$(printf '%s' "$MAC_CERT_PASSWORD" | tr -d ' \r\n')"
            export APPLE_API_KEY=~/private_keys/AuthKey_$APPLE_KEY_ID.p8 APPLE_API_KEY_ID="$APPLE_KEY_ID" APPLE_API_ISSUER="$APPLE_ISSUER_ID"
            npx electron-builder --mac dmg --universal
            DMG=$(ls dist/*.dmg)
            xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY" --key-id "$APPLE_KEY_ID" --issuer "$APPLE_ISSUER_ID" --wait
            xcrun stapler staple "$DMG"
            spctl -a -t open --context context:primary-signature -v "$DMG"
            rm -rf ~/private_keys "$RUNNER_TEMP/devid.p12"
          else
            echo "::warning::Mac app is UNSIGNED (MAC_CERT_P12 secret missing)"
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac dmg --universal -c.mac.identity=- -c.mac.notarize=false
          fi
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: desktop/dist/*.dmg }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: desktop
        run: |
          npm install
          npm run build:linux
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: desktop/dist/*.AppImage }

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install and sync
        working-directory: mobile
        run: |
          npm ci || npm install
          node configure.js
          npx cap sync ios
          node patch-native.js
      - name: Compile check (no signing)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build | tail -30
      - name: Package Xcode project
        run: |
          cd mobile && rm -rf node_modules/.cache && cd .. && zip -qry OENOD-iOS-Xcode-project.zip mobile oenod.app.json -x 'mobile/android/*' 'mobile/ios/App/build/*' '*/DerivedData/*'
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: OENOD-iOS-Xcode-project.zip }

  release:
    needs: [android, windows, mac, linux, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - run: ls -la files
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apps-3.0.0-${{ github.run_number }}
          name: OENOD apps 3.0.0 (build ${{ github.run_number }})
          draft: true
          target_commitish: ${{ github.sha }}
          files: files/*
