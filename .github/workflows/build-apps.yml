name: Build OENOD apps
on:
  push:
    branches: [apps-build]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install and sync
        working-directory: mobile
        run: |
          npm ci || npm install
          node configure.js
          npx cap sync android
          node patch-native.js
      - name: Build unsigned release AAB and APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease
      - name: Collect
        run: |
          mkdir -p out
          cp mobile/android/app/build/outputs/bundle/release/*.aab out/OENOD-unsigned.aab
          cp mobile/android/app/build/outputs/apk/release/*.apk out/OENOD-unsigned.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          cp $BT/lib/apksigner.jar out/apksigner.jar
          cp $BT/zipalign out/zipalign-linux
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/ }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: desktop
        run: |
          npm install
          npm run build:win
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: desktop/dist/*.exe }

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install
          npm run prebuild
          npx electron-builder --mac dmg --universal -c.mac.identity=-
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: desktop/dist/*.dmg }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: desktop
        run: |
          npm install
          npm run build:linux
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: desktop/dist/*.AppImage }

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install and sync
        working-directory: mobile
        run: |
          npm ci || npm install
          node configure.js
          npx cap sync ios
          node patch-native.js
      - name: Compile check (no signing)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build | tail -30
      - name: Package Xcode project
        run: |
          cd mobile && rm -rf node_modules/.cache && cd .. && zip -qry OENOD-iOS-Xcode-project.zip mobile oenod.app.json -x 'mobile/android/*' 'mobile/ios/App/build/*' '*/DerivedData/*'
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: OENOD-iOS-Xcode-project.zip }

  release:
    needs: [android, windows, mac, linux, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - run: ls -la files
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apps-3.0.0-${{ github.run_number }}
          name: OENOD apps 3.0.0 (build ${{ github.run_number }})
          draft: true
          target_commitish: ${{ github.sha }}
          files: files/*
