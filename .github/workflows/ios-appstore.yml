name: Send iPhone app to App Store Connect
# Runs when the apps-build branch is pushed to the ios-store branch, once the four Apple secrets are saved in this repository:
# APPLE_KEY_ID, APPLE_ISSUER_ID, APPLE_TEAM_ID and APPLE_KEY_P8 (the whole .p8 file).
# It builds, signs (automatic signing through the App Store Connect API key) and uploads the build to App Store Connect.
on:
  push:
    branches: [ios-store]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios-appstore:
    runs-on: macos-latest
    env:
      APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_KEY_P8: ${{ secrets.APPLE_KEY_P8 }}
    steps:
      - name: Check the Apple secrets
        run: |
          for v in APPLE_KEY_ID APPLE_ISSUER_ID APPLE_TEAM_ID APPLE_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install
        working-directory: native
        run: npm ci
      - name: Generate iOS project and pods
        working-directory: native
        run: npx expo prebuild --platform ios
      - name: Save the API key for this run only
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$APPLE_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: Archive (signed for the App Store)
        working-directory: native/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          set -o pipefail
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OENOD.xcarchive" archive \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" -authenticationKeyID "$APPLE_KEY_ID" -authenticationKeyIssuerID "$APPLE_ISSUER_ID" | tail -60
      - name: Upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/OENOD.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" -authenticationKeyID "$APPLE_KEY_ID" -authenticationKeyIssuerID "$APPLE_ISSUER_ID" | tail -60
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

  # Fills in the App Store listing from native/fastlane: name, subtitle, description, keywords, links,
  # categories, review notes and the screenshots (English + French). Runs next to the build, no binary needed.
  listing:
    runs-on: macos-latest
    env:
      APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
      APPLE_KEY_P8: ${{ secrets.APPLE_KEY_P8 }}
    steps:
      - name: Check the Apple secrets
        run: |
          for v in APPLE_KEY_ID APPLE_ISSUER_ID APPLE_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v"; exit 1; fi
          done
      - name: Check the key with Apple (prints yes/no only, never the values)
        run: |
          bad=0
          [[ "$APPLE_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] && echo "RESULT key-id-format: yes" || { echo "RESULT key-id-format: NO (length ${#APPLE_KEY_ID})"; bad=1; }
          [[ "$APPLE_ISSUER_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] && echo "RESULT issuer-format: yes" || { echo "RESULT issuer-format: NO (length ${#APPLE_ISSUER_ID})"; bad=1; }
          printf '%s\n' "$APPLE_KEY_P8" | grep -q -- '-----BEGIN PRIVATE KEY-----' && echo "RESULT p8-begin: yes" || { echo "RESULT p8-begin: NO"; bad=1; }
          printf '%s\n' "$APPLE_KEY_P8" | grep -q -- '-----END PRIVATE KEY-----' && echo "RESULT p8-end: yes" || { echo "RESULT p8-end: NO"; bad=1; }
          printf '%s\n' "$APPLE_KEY_P8" | openssl pkey -noout 2>/dev/null && echo "RESULT p8-valid: yes" || { echo "RESULT p8-valid: NO"; bad=1; }
          cat > /tmp/asc.rb <<'RB'
          require 'jwt'; require 'openssl'; require 'net/http'; require 'json'
          k = OpenSSL::PKey.read(ENV['APPLE_KEY_P8'])
          u = URI('https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.oenod.app')
          ok = false
          { 'team-key' => { iss: ENV['APPLE_ISSUER_ID'] }, 'individual-key' => { sub: 'user' } }.each do |kind, extra|
            t = JWT.encode({ iat: Time.now.to_i - 60, exp: Time.now.to_i + 600, aud: 'appstoreconnect-v1' }.merge(extra), k, 'ES256', { kid: ENV['APPLE_KEY_ID'], typ: 'JWT' })
            r = Net::HTTP.start(u.host, 443, use_ssl: true) { |h| h.request(Net::HTTP::Get.new(u, 'Authorization' => "Bearer #{t}")) }
            b = JSON.parse(r.body) rescue {}
            puts "RESULT #{kind}: http #{r.code}#{r.code == '200' ? ', app record found: ' + ((b['data'] || []).any? ? 'yes' : 'no') : ''}"
            ok ||= r.code == '200'
          end
          exit(ok ? 0 : 1)
          RB
          ruby /tmp/asc.rb || { echo "RESULT apple-check: failed (see lines above)"; bad=1; }
          echo "RESULT summary done"
          [ $bad = 0 ]
      - uses: actions/checkout@v4
      - name: Save the API key for this run only
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          python3 -c 'import json,os; print(json.dumps({"key_id":os.environ["APPLE_KEY_ID"],"issuer_id":os.environ["APPLE_ISSUER_ID"],"key":os.environ["APPLE_KEY_P8"],"in_house":False}))' > "$RUNNER_TEMP/keys/api.json"
          chmod 600 "$RUNNER_TEMP/keys/api.json"
      - name: Upload listing and screenshots
        working-directory: native
        run: |
          which fastlane || brew install fastlane
          VERSION=$(python3 -c 'import json; print(json.load(open("app.json"))["expo"]["version"])')
          fastlane deliver --api_key_path "$RUNNER_TEMP/keys/api.json" --app_identifier com.oenod.app --platform ios \
            --app_version "$VERSION" --metadata_path fastlane/metadata --screenshots_path fastlane/screenshots \
            --skip_binary_upload true --submit_for_review false --automatic_release false \
            --overwrite_screenshots true --force true --run_precheck_before_submit false --ignore_language_directory_validation true
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
