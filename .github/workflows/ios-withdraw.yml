name: Pull App Store submission and rename version
on:
  push:
    branches: [ios-withdraw]
permissions:
  contents: read
jobs:
  withdraw:
    runs-on: ubuntu-latest
    env:
      APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
      APPLE_KEY_P8: ${{ secrets.APPLE_KEY_P8 }}
      NEW_VERSION: '4.1.0'
      WHATS_NEW: 'A brand new look, and everything inside the app: a fresh modern design on every screen, every tool working right inside the app, a new Meet with join by code, and French, Spanish and Arabic on all new screens.'
    steps:
      - uses: actions/checkout@v4
      - name: Withdraw and rename
        run: gem list -i jwt >/dev/null || sudo gem install jwt; ruby native/ios-ci/asc_withdraw.rb
